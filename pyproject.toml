[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "backoffs"
version = "1.0.0"
description = "Typed backoff delays: exponential, linear and Fibonacci growth, AWS, gRPC and Google Cloud jitter, budgets, Retry-After, retry helpers and a CLI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Javier Lianes", email = "javier@lianes8studio.com" }]
keywords = ["backoff", "retry", "jitter", "exponential", "delay", "iterator", "retry-after", "asyncio", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
    "Framework :: AsyncIO",
    "Environment :: Console",
]
dependencies = []

[project.scripts]
backoffs = "backoffs._cli:main"

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "build", "twine"]

[project.urls]
Homepage = "https://lianes8studio.com"
Source = "https://github.com/JaviLianes8/backoffs"
Issues = "https://github.com/JaviLianes8/backoffs/issues"
Changelog = "https://github.com/JaviLianes8/backoffs/blob/main/CHANGELOG.md"
LinkedIn = "https://www.linkedin.com/in/jlianes/"
Funding = "https://buymeacoffee.com/jlianesglrs"

[tool.hatch.build.targets.wheel]
packages = ["src/backoffs"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/backoffs",
    "/tests",
    "/scripts/fetch_sources.py",
    "/scripts/oracle_fixture.py",
    "/README.md",
    "/GUIDE.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/requirements-dev.txt",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
