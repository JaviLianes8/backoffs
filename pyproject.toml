[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "backoffs"
version = "0.2.0"
description = "Typed backoff delays: exponential, linear and Fibonacci growth, AWS, gRPC and Google Cloud jitter, budgets, Retry-After, retry helpers and a CLI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Javier Lianes", email = "javier@lianes8studio.com" }]
keywords = ["backoff", "retry", "jitter", "exponential", "delay", "iterator", "retry-after", "asyncio", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
    "Framework :: AsyncIO",
    "Environment :: Console",
]
dependencies = []

[project.scripts]
backoffs = "backoffs._cli:main"

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "build", "twine"]

[project.urls]
Homepage = "https://lianes8studio.com"
Repository = "https://github.com/JaviLianes8/backoffs"
Issues = "https://github.com/JaviLianes8/backoffs/issues"
Changelog = "https://github.com/JaviLianes8/backoffs/blob/main/CHANGELOG.md"
LinkedIn = "https://www.linkedin.com/in/jlianes/"
Funding = "https://buymeacoffee.com/jlianesglrs"

[tool.hatch.build.targets.wheel]
packages = ["src/backoffs"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
